<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Seaty Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <style>
    html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #bcd8ee; font-family: Inter, sans-serif; }
    #scene { position: absolute; inset: 0; }
    /* Soft band behind the text so it reads on top of the city */
    #band {
      position: absolute; left: 0; right: 0; top: 470px; height: 500px; z-index: 1;
      background: linear-gradient(180deg, rgba(14,24,40,0) 0%, rgba(14,24,40,.62) 26%, rgba(14,24,40,.7) 50%, rgba(14,24,40,.62) 74%, rgba(14,24,40,0) 100%);
    }
    /* YouTube safe area for all devices: 1546 x 423, centered */
    #safe { position: absolute; z-index: 2; left: 507px; top: 508px; width: 1546px; height: 423px;
      display: flex; align-items: center; justify-content: center; gap: 50px; color: #fff; box-sizing: border-box; padding: 0 60px; }
    .logo { font-weight: 900; font-size: 164px; letter-spacing: -7px; line-height: .9; text-shadow: 0 10px 40px rgba(0,0,0,.4); }
    .logo span { color: #ff7a45; }
    .right { display: flex; flex-direction: column; gap: 22px; }
    .tag { font-weight: 800; font-size: 48px; line-height: 1.05; text-shadow: 0 6px 24px rgba(0,0,0,.4); white-space: nowrap; }
    .tag b { color: #f5b82e; }
    .chips { display: flex; gap: 14px; }
    .chip { font-weight: 800; font-size: 26px; padding: 10px 20px; border-radius: 999px; background: #fff; color: #14202f; white-space: nowrap; }
    .chip.o { background: #ff7a45; color: #fff; }
    body.guides #safe { outline: 4px dashed #0f0; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="band"></div>
  <div id="safe">
    <div class="logo">Seaty<span>.</span></div>
    <div class="right">
      <div class="tag">The city <b>built by your comments</b></div>
      <div class="chips">
        <div class="chip o">Comment = a house</div>
        <div class="chip">Every video = +1 floor</div>
        <div class="chip">New Short daily</div>
      </div>
    </div>
  </div>
  <script type="module">
    import { createWorld, THREE } from '../web/world.js';
    if (location.search.includes('guides')) document.body.classList.add('guides');

    // A lively town made up for the banner (no real names are shown).
    let s = 7;
    const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32);
    const residents = [];
    for (let i = 0; i < 170; i++) {
      const x = r();
      const floors = x < 0.62 ? 1 + Math.floor(r() * 3) : x < 0.92 ? 4 + Math.floor(r() * 9) : 14 + Math.floor(r() * 22);
      residents.push({ id: `b${i}`, name: '', floors, joined: String(i).padStart(4, '0') });
    }
    const city = { residents, videoCount: 30, residentCount: residents.length, totalFloors: 0, channel: { title: 'Seaty' } };

    const world = createWorld({ container: document.getElementById('scene'), width: 2560, height: 1440, pixelRatio: 1, shadowSize: 4096 });
    world.build(city, { labelTop: 0 });
    world.camera.fov = 28;
    world.camera.updateProjectionMatrix();
    const target = new THREE.Vector3(0, 6, 0);
    const az = 0.75, el = (24 * Math.PI) / 180, dist = 255;
    world.camera.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist);
    world.camera.lookAt(target);
    world.scene.fog.near = 260; world.scene.fog.far = 900;
    world.tick(12.3);
    await document.fonts.ready;
    world.render();
    window.brandReady = true;
  </script>
</body>
</html>
