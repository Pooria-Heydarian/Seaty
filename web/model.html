<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seaty Model Preview</title>
  <!--
    Look at one house on its own, from every side (used in the daily session to check new models).
      model.html?shape=gem-head&floors=1&wall=%23a3415e&roofColor=%231f1424&accent=%23ff4d8d
      model.html?u=<channelId>            the house of that resident, from specials.json
      model.html?upgrades=dog,pond        add yard upgrades to the preview house
      model.html?landmark=stadium&floors=2&color=%231f4d2b   one landmark alone
    Add &night=1 for night. Drag to turn. window.setView(azimuthRadians, elevationDeg, distance) for screenshots.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "./catalog.js": "./catalog.js?v=63adf1a6b0",
        "./christmas.js": "./christmas.js?v=63adf1a6b0",
        "./city.js": "./city.js?v=63adf1a6b0",
        "./extra-models.js": "./extra-models.js?v=63adf1a6b0",
        "./house-models.js": "./house-models.js?v=63adf1a6b0",
        "./houses.js": "./houses.js?v=63adf1a6b0",
        "./layout.js": "./layout.js?v=63adf1a6b0",
        "./podcast.js": "./podcast.js?v=63adf1a6b0",
        "./tour.js": "./tour.js?v=63adf1a6b0",
        "./trailer.js": "./trailer.js?v=63adf1a6b0",
        "./video.js": "./video.js?v=63adf1a6b0",
        "./world.js": "./world.js?v=63adf1a6b0"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd8ee; font: 14px system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; }
    #info { position: fixed; left: 12px; top: 12px; background: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="info">Loading…</div>
  <script type="module">
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createWorld, THREE } from './world.js';

    const q = new URLSearchParams(location.search);
    const world = createWorld({ container: document.getElementById('scene'), width: innerWidth, height: innerHeight });
    const controls = new OrbitControls(world.camera, world.renderer.domElement);

    let specials = { houses: [], upgrades: [], landmarks: [] };
    let resident = { id: 'preview', name: 'preview', floors: Number(q.get('floors') || 1), joined: '2026-01-01' };
    if (q.get('u')) {
      const [city, sp] = await Promise.all([fetch('data/city.json').then((r) => r.json()), fetch('data/specials.json').then((r) => r.json())]);
      const r = city.residents.find((x) => x.id === q.get('u'));
      if (r) resident = { ...r, joined: '2026-01-01' };
      specials = {
        houses: (sp.houses || []).filter((h) => h.resident === resident.id),
        upgrades: (sp.upgrades || []).filter((u) => u.resident === resident.id),
        landmarks: [],
      };
    } else {
      const recipe = Object.fromEntries(['shape', 'roof', 'wall', 'roofColor', 'door', 'accent'].filter((k) => q.get(k)).map((k) => [k, q.get(k)]));
      if (q.get('extras')) recipe.extras = q.get('extras').split(',');
      if (recipe.shape) specials.houses.push({ resident: 'preview', recipe, title: recipe.shape });
    }
    if (q.get('upgrades')) for (const type of q.get('upgrades').split(',')) specials.upgrades.push({ resident: resident.id, type });
    if (q.get('landmark')) {
      specials.landmarks.push({ id: 'preview-landmark', type: q.get('landmark'), name: q.get('landmark'), requestedById: resident.id,
        ...(q.get('color') ? { color: q.get('color') } : {}), ...(q.get('accent') ? { accent: q.get('accent') } : {}) });
    }
    world.build({ residents: [resident], videoCount: 1, residentCount: 1, totalFloors: resident.floors }, { labelTop: 0, specials });
    const e = world.list[0];
    e.outer.rotation.y = 0; // front (door side) faces +z
    world.townHall.visible = false;
    world.setNight(q.get('night') === '1');
    const lm = world.landmarks.get('preview-landmark');
    if (lm) { lm.outer.rotation.y = 0; e.outer.visible = false; }
    const focus = lm ? { pos: lm.outer.position, top: lm.height } : { pos: e.outer.position, top: e.roofTop };
    document.getElementById('info').textContent = `${lm ? q.get('landmark') : specials.houses[0]?.recipe?.shape || 'house'} · ${resident.floors} floor(s) · top ${focus.top.toFixed(1)}`;

    const at = (q.get('at') || '0,0').split(',').map(Number); // aim at a spot in the yard (local x,z)
    const target = new THREE.Vector3(focus.pos.x + at[0], q.get('at') ? 0.6 : focus.top * 0.4, focus.pos.z + at[1]);
    window.setView = (az = 0.5, elev = 22, dist = lm ? Math.max(22, focus.top * 2.6) : Math.max(14, focus.top * 1.9)) => {
      const el = (elev * Math.PI) / 180;
      world.camera.position.set(target.x + Math.sin(az) * Math.cos(el) * dist, target.y + Math.sin(el) * dist, target.z + Math.cos(az) * Math.cos(el) * dist);
      controls.target.copy(target);
      controls.update();
    };
    window.setView();
    const loop = (t) => { world.tick(t / 1000); controls.update(); world.render(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    window.modelReady = true;
  </script>
</body>
</html>
