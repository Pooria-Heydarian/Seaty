<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seaty Trailer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=block" rel="stylesheet" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <style>
    :root { --ink: #14202f; --paper: #fff; --accent: #ff7a45; --gold: #f5b82e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0d1117; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    body.preview { display: grid; place-items: center; height: 100vh; }
    #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #bcd8ee; }
    #scene { position: absolute; inset: 0; }
    .ov { position: absolute; left: 0; right: 0; opacity: 0; z-index: 2; visibility: hidden; }

    #head { top: 220px; text-align: center; color: #fff; padding: 0 70px; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
    #head .kicker { font-weight: 800; font-size: 44px; letter-spacing: 6px; color: var(--gold); }
    #shade { position: absolute; left: 0; right: 0; top: 0; height: 900px; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(10,18,30,.62) 0%, rgba(10,18,30,.42) 45%, rgba(10,18,30,0) 100%); }
    #head .big { font-weight: 900; font-size: 92px; line-height: 1.02; letter-spacing: -3px; margin-top: 10px; }
    #head.welcome .big { font-size: 190px; letter-spacing: -7px; }
    #head .big span { color: var(--gold); }
    #head .sub { font-weight: 700; font-size: 48px; line-height: 1.22; margin-top: 26px; }
    #head .sub b { color: var(--gold); }

    #card { top: 1150px; margin: 0 90px; background: var(--paper); border-radius: 40px; padding: 34px 40px; box-shadow: 0 30px 80px rgba(10,20,40,.35); }
    #card .row { display: flex; align-items: center; gap: 24px; }
    #card .avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 48px; }
    #card .name { font-weight: 900; font-size: 46px; color: var(--ink); }
    #card .tag { font-weight: 700; font-size: 28px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
    #card .comment { margin-top: 22px; font-weight: 500; font-size: 42px; color: var(--ink); }

    #floors { top: 1180px; text-align: center; }
    #floors .n { display: inline-block; font-weight: 900; font-size: 150px; color: var(--ink); background: var(--paper); border-radius: 44px; padding: 10px 50px; box-shadow: 0 30px 80px rgba(10,20,40,.3); }
    #floors .n b { color: var(--accent); }
    #floors .l { margin-top: 18px; font-weight: 800; font-size: 46px; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,.5); }

    #board { top: 700px; margin: 0 90px; background: rgba(20,32,47,.92); color: #fff; border-radius: 40px; padding: 34px 44px; }
    #board .r { display: flex; justify-content: space-between; align-items: center; gap: 18px; font-size: 48px; font-weight: 800; padding: 10px 0; }
    #board .r .m { width: 64px; height: 64px; flex: none; }
    #board .r .who { flex: 1; }
    #board .r .f { color: var(--gold); }

    #award { top: 720px; text-align: center; padding: 0 80px; color: #fff; }
    #award svg { width: 300px; height: 300px; filter: drop-shadow(0 20px 50px rgba(245,184,46,.55)); }
    #award .chip { display: inline-block; margin-top: 30px; font-weight: 800; font-size: 44px; background: var(--gold); color: var(--ink); padding: 16px 34px; border-radius: 999px; }
    #award .fine { display: inline-block; margin-top: 24px; font-weight: 700; font-size: 32px; color: #fff; background: rgba(10,18,30,.82); padding: 12px 26px; border-radius: 999px; }
    #medals .md div { background: rgba(10,18,30,.78); border-radius: 22px; padding: 10px 8px; margin-top: 6px; }

    #medals { top: 760px; display: flex; justify-content: center; gap: 40px; padding: 0 60px; }
    #medals .md { width: 280px; text-align: center; color: #fff; font-weight: 800; font-size: 34px; line-height: 1.15; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
    #medals svg { width: 220px; height: 280px; filter: drop-shadow(0 16px 30px rgba(0,0,0,.4)); }

    #cta { top: 760px; text-align: center; padding: 0 80px; }
    #cta .btn { display: inline-block; font-weight: 900; font-size: 52px; background: #e62117; color: #fff; padding: 22px 46px; border-radius: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    #cta .url { margin-top: 36px; display: inline-block; font-weight: 800; font-size: 36px; background: var(--paper); color: var(--ink); padding: 14px 30px; border-radius: 999px; }

    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 3; pointer-events: none; }
    .vlabel { font-weight: 800; font-size: 38px; color: var(--ink); background: var(--paper); padding: 10px 24px; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .vlabel.you { background: var(--accent); color: #fff; font-size: 44px; }
    .vlabel.top1 { background: var(--gold); }

    #controls { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #1c2430; color: #fff; padding: 8px 14px; border-radius: 999px; font: 13px system-ui; z-index: 10; }
    #controls input { width: 260px; }
    #controls button { background: #ff7a45; color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
    body.render #controls { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="scene"></div>
    <div id="shade"></div>
    <div class="ov" id="head"><div class="kicker" id="h-kicker"></div><div class="big" id="h-big"></div><div class="sub" id="h-sub"></div></div>
    <div class="ov" id="card">
      <div class="row"><div class="avatar">Y</div><div><div class="name">@you</div><div class="tag">New citizen</div></div></div>
      <div class="comment">“Hi Seaty! Can I move in? 👋”</div>
    </div>
    <div class="ov" id="floors"><div class="n" id="f-n"></div><div class="l">Floors</div></div>
    <div class="ov" id="board"></div>
    <div class="ov" id="award">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path d="M55 30h90v35c0 30-20 52-45 52S55 95 55 65z" fill="#f5b82e" />
        <path d="M55 42H30c0 28 14 42 30 44M145 42h25c0 28-14 42-30 44" fill="none" stroke="#f5b82e" stroke-width="10" stroke-linecap="round" />
        <rect x="90" y="115" width="20" height="28" fill="#e0a21c" />
        <rect x="62" y="142" width="76" height="18" rx="6" fill="#f5b82e" />
        <rect x="50" y="160" width="100" height="16" rx="6" fill="#e0a21c" />
        <path d="M100 48l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z" fill="#fff6d8" />
      </svg>
      <div><div class="chip">More floors = more chances</div></div>
      <div><div class="fine">Free to join · 18+ · Official rules in the description</div></div>
    </div>
    <div class="ov" id="medals"></div>
    <div class="ov" id="cta"><div class="btn">SUBSCRIBE &amp; COMMENT 👇</div><br /><div class="url" id="cta-url"></div></div>
    <div id="flash"></div>
  </div>
  <div id="controls"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0" /><span id="time"></span></div>
  <script type="module" src="trailer.js"></script>
</body>
</html>
