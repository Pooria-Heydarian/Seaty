<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Seaty logo, Christmas version: a pine-green night, snow on the roofs, a Santa hat on the house, falling snow -->
  <rect width="64" height="64" rx="14" fill="#1f6b45"/>
  <!-- falling snow -->
  <g fill="#fff" opacity="0.9">
    <circle cx="7" cy="9" r="1.6"/><circle cx="18" cy="6" r="1.2"/><circle cx="29" cy="11" r="1.4"/>
    <circle cx="36" cy="5" r="1.1"/><circle cx="59" cy="9" r="1.3"/><circle cx="6" cy="21" r="1.2"/>
    <circle cx="26" cy="17" r="1"/>
  </g>
  <!-- left tower with snow on top -->
  <rect x="9" y="25" width="13" height="26" rx="1.5" fill="#fff"/>
  <path d="M7.5 26 Q15.5 20.5 23.5 26 Z" fill="#fff"/>
  <!-- tall right tower with snow on top -->
  <rect x="41" y="12" width="14" height="39" rx="1.5" fill="#fff"/>
  <path d="M39.5 13 Q48 7 56.5 13 Z" fill="#fff"/>
  <!-- the house, a dark roof with a snow line, and a Santa hat on top -->
  <path d="M22 33 L31.5 23 L41 33 V51 H22 Z" fill="#fff"/>
  <path d="M19.5 34 L31.5 21.5 L43.5 34" fill="none" stroke="#0b1220" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M21.5 31.5 L31.5 21 L41.5 31.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M25.5 20.5 Q30 7 40 11.5 L36 19.5 Z" fill="#d62828"/>
  <circle cx="40.5" cy="11" r="2.6" fill="#fff"/>
  <rect x="24" y="18.5" width="14" height="4.2" rx="2.1" fill="#fff"/>
  <!-- warm lit windows and a string of lights on the left tower -->
  <g fill="#ffd23f">
    <rect x="12" y="31" width="3" height="3"/><rect x="16.5" y="31" width="3" height="3"/>
    <rect x="12" y="37" width="3" height="3"/><rect x="16.5" y="37" width="3" height="3"/>
    <rect x="44" y="18" width="3" height="3"/><rect x="49" y="18" width="3" height="3"/>
    <rect x="44" y="24" width="3" height="3"/><rect x="49" y="24" width="3" height="3"/>
    <rect x="44" y="30" width="3" height="3"/><rect x="49" y="30" width="3" height="3"/>
    <rect x="44" y="36" width="3" height="3"/><rect x="49" y="36" width="3" height="3"/>
  </g>
  <g>
    <circle cx="11" cy="45" r="1.3" fill="#e63946"/><circle cx="15.5" cy="46" r="1.3" fill="#ffd23f"/><circle cx="20" cy="45" r="1.3" fill="#3a86ff"/>
  </g>
  <!-- the door, with a wreath -->
  <rect x="29" y="40" width="5" height="11" rx="1" fill="#0b1220"/>
  <circle cx="31.5" cy="37" r="2.2" fill="none" stroke="#2a9d5c" stroke-width="1.6"/>
  <!-- snowy bank and the icy lake -->
  <rect x="0" y="48.5" width="64" height="3" fill="#fff"/>
  <path d="M0 51 H64 Q64 64 50 64 H14 Q0 64 0 51 Z" fill="#2b78c4"/>
  <path d="M8 57.5 Q12 54.5 16 57.5 T24 57.5 T32 57.5 T40 57.5 T48 57.5 T56 57.5" fill="none" stroke="#bfe3ff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
