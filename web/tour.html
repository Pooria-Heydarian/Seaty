<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seaty City Tour</title>
  <!-- The landscape city tour (1920x1080). Preview here; render with: npm run tour -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=block" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "./catalog.js": "./catalog.js?v=80181df852",
        "./city.js": "./city.js?v=80181df852",
        "./extra-models.js": "./extra-models.js?v=80181df852",
        "./house-models.js": "./house-models.js?v=80181df852",
        "./houses.js": "./houses.js?v=80181df852",
        "./layout.js": "./layout.js?v=80181df852",
        "./podcast.js": "./podcast.js?v=80181df852",
        "./tour.js": "./tour.js?v=80181df852",
        "./trailer.js": "./trailer.js?v=80181df852",
        "./video.js": "./video.js?v=80181df852",
        "./world.js": "./world.js?v=80181df852"
      }
    }
  </script>
  <style>
    :root { --ink: #14202f; --paper: #fff; --accent: #ff7a45; --gold: #f5b82e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0d1117; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    body.preview { display: grid; place-items: center; height: 100vh; }
    #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #bcd8ee; transform-origin: center; }
    #scene { position: absolute; inset: 0; }
    .ov { position: absolute; opacity: 0; visibility: hidden; z-index: 2; will-change: transform, opacity; }

    #shade { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, rgba(10,18,30,.55) 0%, rgba(10,18,30,.25) 45%, rgba(10,18,30,0) 70%); }

    #title { left: 120px; top: 300px; color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
    #title .kicker { font-weight: 800; font-size: 40px; letter-spacing: 8px; color: var(--gold); }
    #title .big { font-weight: 900; font-size: 150px; line-height: .95; letter-spacing: -5px; margin-top: 14px; }
    #title .big span { color: var(--accent); }
    #title .sub { font-weight: 700; font-size: 46px; margin-top: 26px; max-width: 1100px; line-height: 1.2; }

    #chapter { left: 64px; top: 56px; background: rgba(20,32,47,.85); color: #fff; padding: 14px 28px; border-radius: 999px; font-weight: 800; font-size: 30px; letter-spacing: 1px; }
    #chapter span { color: var(--gold); margin-right: 14px; }

    #caption { left: 64px; bottom: 64px; background: var(--paper); border-radius: 28px; padding: 26px 36px; box-shadow: 0 24px 70px rgba(10,20,40,.35); min-width: 560px; max-width: 1100px; }
    #caption .tag { font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    #caption .name { font-weight: 900; font-size: 56px; color: var(--ink); line-height: 1.05; margin-top: 6px; }
    #caption .sub { font-weight: 600; font-size: 30px; color: #4a5a70; margin-top: 10px; line-height: 1.3; }

    #panel { right: 64px; top: 50%; width: 760px; background: rgba(255,255,255,.96); border-radius: 32px; padding: 40px 46px; box-shadow: 0 30px 80px rgba(10,20,40,.35); margin-top: -330px; }
    #panel h2 { margin: 0 0 22px; font-size: 44px; font-weight: 900; color: var(--ink); }
    #panel ul { list-style: none; margin: 0; padding: 0; }
    #panel li { display: flex; gap: 20px; align-items: flex-start; font-size: 32px; font-weight: 600; color: var(--ink); line-height: 1.3; margin: 18px 0; opacity: 0; transform: translateX(30px); }
    #panel li b { color: var(--accent); font-weight: 900; }
    #panel li .ic { flex: none; width: 56px; height: 56px; border-radius: 16px; background: #fff1ea; display: grid; place-items: center; font-size: 32px; }

    #cta { left: 0; right: 0; top: 210px; text-align: center; color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
    #cta .big { font-weight: 900; font-size: 120px; line-height: 1; letter-spacing: -3px; }
    #cta .big span { color: var(--gold); }
    #cta .small { font-weight: 700; font-size: 44px; margin-top: 30px; }
    #cta .row { display: flex; gap: 24px; justify-content: center; margin-top: 50px; text-shadow: none; }
    #cta .pill { font-weight: 800; font-size: 36px; background: var(--paper); color: var(--ink); padding: 18px 34px; border-radius: 999px; }
    #cta .pill.red { background: #e63946; color: #fff; }

    .dlabel { font-weight: 900; font-size: 30px; color: var(--ink); background: var(--paper); padding: 10px 22px; border-radius: 16px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.3); border-left: 8px solid var(--accent); }
    .label.landmark { display: none; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }

    #controls { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #1c2430; color: #fff; padding: 8px 14px; border-radius: 999px; font: 13px system-ui; z-index: 10; }
    #controls input { width: 420px; }
    #controls button { background: #ff7a45; color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
    body.render #controls { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="scene"></div>
    <div id="shade"></div>
    <div class="ov" id="title"><div class="kicker" id="t-kicker"></div><div class="big" id="t-big"></div><div class="sub" id="t-sub"></div></div>
    <div class="ov" id="chapter"></div>
    <div class="ov" id="caption"><div class="tag" id="c-tag"></div><div class="name" id="c-name"></div><div class="sub" id="c-sub"></div></div>
    <div class="ov" id="panel"><h2 id="p-title"></h2><ul id="p-list"></ul></div>
    <div class="ov" id="cta"><div class="big" id="cta-big"></div><div class="small" id="cta-small"></div><div class="row"><div class="pill" id="cta-url"></div><div class="pill red">Subscribe</div></div></div>
    <div id="flash"></div>
  </div>
  <div id="controls"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0" /><span id="time">0.0s</span></div>
  <script type="module" src="tour.js?v=80181df852"></script>
</body>
</html>
