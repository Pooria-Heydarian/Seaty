# Seaty daily run (06:07 UTC):
#   1. read every comment written before 06:00 UTC (later comments count for tomorrow)
#   2. AI step: find special-building requests in the last day's comments, build what is possible,
#      put the rest on the wish list, and write reply drafts
#   3. update the city + town report
#   4. render the daily Short (voice + music)
#   5. save the video + reply drafts as a download on the run page (Artifacts -> seaty-video)
#   6. commit the data and publish the website
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   YOUTUBE_API_KEY, YOUTUBE_CHANNEL_ID   reading comments
#   ANTHROPIC_API_KEY                     the AI step (without it: no specials, no reply drafts)
# Optional variables (same page -> Variables):
#   MIN_COMMENT_LENGTH, CITY_START_DATE, SEATY_VOICE (af_heart, af_bella, am_michael, am_fenrir, bf_emma, bm_george)

name: Daily city update

on:
  schedule:
    - cron: '7 6 * * *' # 06:07 UTC. Not :00, which GitHub often skips when busy.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

# Separate queues: a website-only run (push) can never cancel the daily run.
concurrency:
  group: city-${{ github.event_name == 'push' && 'site' || 'daily' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DAILY: ${{ github.event_name != 'push' }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        if: env.DAILY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          npm ci --no-audit --no-fund

      - name: 1. Read comments (before 06:00 UTC)
        if: env.DAILY == 'true'
        id: fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          MIN_COMMENT_LENGTH: ${{ vars.MIN_COMMENT_LENGTH || '2' }}
          CITY_START_DATE: ${{ vars.CITY_START_DATE }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ] || [ -z "$YOUTUBE_CHANNEL_ID" ]; then
            echo "::warning::YOUTUBE_API_KEY / YOUTUBE_CHANNEL_ID secrets not set. Publishing the current city only."
            exit 0
          fi
          npm run fetch
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 2. AI step (special buildings + reply drafts)
        if: steps.fetch.outputs.ok == 'true'
        continue-on-error: true # if the AI step fails, the city and video are still made
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai

      - name: 3. Town report
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        run: |
          npm run report
          cat reports/$(date -u +%F).md >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the voice model
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-q8-v1

      - name: 4. Render the daily Short (with voiceover)
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        env:
          SEATY_VOICE: ${{ vars.SEATY_VOICE || 'af_heart' }}
        run: npm run video

      - name: 5. Save video + reply drafts as a download
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seaty-video
          path: video/*
          retention-days: 14

      - name: 6. Commit city data, specials, wish list, report
        if: ${{ !cancelled() && env.DAILY == 'true' }}
        run: |
          git config user.name "seaty-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data reports data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "City update $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: web
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      - name: Site URL
        if: ${{ !cancelled() }}
        run: echo "City is live at ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
