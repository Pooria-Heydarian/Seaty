# Seaty on GitHub:
#
#   push to main (from the daily session)  -> publish web/ to GitHub Pages
#   Actions -> Daily city update -> Run workflow  (fallback for a day you skip the daily session):
#      read comments -> town report -> render the Short (voice + music) -> save it as a download
#      -> commit the data -> publish the site. No special buildings: those are added in the daily session.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   YOUTUBE_API_KEY, YOUTUBE_CHANNEL_ID   reading comments (fallback run only)
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN   only for the optional auto-upload
# Optional variables (same page -> Variables):
#   MIN_COMMENT_LENGTH, CITY_START_DATE, SEATY_VOICE (af_heart, af_bella, am_michael, am_fenrir, bf_emma, bm_george)
#   YT_AUTO_UPLOAD=true   upload the Short to YouTube automatically (default: off, download it instead)
#   YT_PRIVACY            public | unlisted | private (for the auto-upload)

name: Daily city update

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

# Separate queues: a website-only run (push) can never cancel a fallback daily run.
concurrency:
  group: city-${{ github.event_name == 'push' && 'site' || 'daily' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DAILY: ${{ github.event_name == 'workflow_dispatch' }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          # Always start from the newest main (a push run must not publish an older city).
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        if: env.DAILY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          npm ci --no-audit --no-fund

      - name: 1. Read comments
        if: env.DAILY == 'true'
        id: fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          MIN_COMMENT_LENGTH: ${{ vars.MIN_COMMENT_LENGTH || '2' }}
          CITY_START_DATE: ${{ vars.CITY_START_DATE }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ] || [ -z "$YOUTUBE_CHANNEL_ID" ]; then
            echo "::warning::YOUTUBE_API_KEY / YOUTUBE_CHANNEL_ID secrets not set. Publishing the current city only."
            exit 0
          fi
          npm run fetch
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 2. Town report
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        run: |
          npm run report
          cat reports/$(date -u +%F).md >> "$GITHUB_STEP_SUMMARY"

      # Save the data right away, before the long video render, so a push made
      # during the render can't block it.
      - name: Commit city data and report
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        run: bash .github/scripts/commit-data.sh "City update $(date -u +%F)"

      - name: Cache the voice model
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-q8-v1

      - name: 3. Render the daily Short (with voiceover)
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        env:
          SEATY_VOICE: ${{ vars.SEATY_VOICE || 'af_heart' }}
        run: npm run video

      - name: 4. Save the video as a download
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seaty-video
          path: video/*
          retention-days: 14

      - name: 5. Upload the Short to YouTube (only if YT_AUTO_UPLOAD is true)
        if: ${{ !cancelled() && steps.fetch.outputs.ok == 'true' && vars.YT_AUTO_UPLOAD == 'true' }}
        continue-on-error: true # a failed upload must not stop the website from publishing
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          npm run upload
          bash .github/scripts/commit-data.sh "Upload log $(date -u +%F)"

      - name: 6. Publish the website
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: web
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      - name: Site URL
        if: ${{ !cancelled() }}
        run: echo "City is live at ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
